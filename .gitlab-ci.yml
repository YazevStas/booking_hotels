stages:
  - build
  - lint_format
  - migrations
  - test
  - deploy


# Общие настройки для Python-задач (lint_format и test)
.python:
  image: python:3.14-slim
  variables:
    UV_CACHE_DIR: .uv-cache
    UV_LINK_MODE: copy
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache
  before_script:
    - pip install --no-cache-dir uv==0.12.19
    - uv sync --frozen
  after_script:
    - uv cache prune --ci

# Общие настройки для задач, которые работают с продакшен-стеком через docker compose
.compose:
  image: docker:29.7
  variables:
    # отдельное имя проекта: у продакшена свои volume (pg_data), не общие с локальным запуском
    COMPOSE_PROJECT_NAME: booking_prod
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - cp "$ENV_PROD" .env
  after_script:
    - rm -f .env


build:
  # docker build выполняется в Docker хоста через проброшенный docker.sock
  image: docker:29.7
  stage: build
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    # пушим образ в Container Registry проекта только из main
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi


ruff_check:
  extends: .python
  stage: lint_format
  script:
    - uv run ruff check src tests

ruff_format:
  extends: .python
  stage: lint_format
  script:
    - uv run ruff format --check src tests

pyright:
  extends: .python
  stage: lint_format
  script:
    # pyright запускает скачанный Node, которому нужна libatomic — в slim-образе её нет
    - apt-get update && apt-get install -y --no-install-recommends libatomic1
    - uv run pyright


migrations:
  extends: .compose
  stage: migrations
  script:
    # поднимает booking_db (ждёт healthcheck), применяет миграции, возвращает код alembic
    - docker compose run --rm --build booking_migrations


test:
  extends: .python
  stage: test
  services:
    - name: postgres:17.6
      alias: postgres
    - name: redis:8.10
      alias: redis
  variables:
    # должны совпадать с DB_USER / DB_PASS / DB_NAME в переменной ENV_TEST
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_password
    POSTGRES_DB: test
  script:
    - cp "$ENV_TEST" .env-test
    - uv run pytest


deploy:
  extends: .compose
  stage: deploy
  script:
    - docker compose up -d --build --remove-orphans
    - docker compose ps
