events {}

http {
    # не больше 3 запросов в секунду с одного IP
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=3r/s;
    # при превышении лимита отвечать 429 Too Many Requests (по умолчанию 503)
    limit_req_status 429;

    server {
        listen 80;

        location / {
            # burst — до 10 запросов сверх лимита пропускаются
            limit_req zone=mylimit burst=10 nodelay;

            proxy_pass http://booking_back:8000;

            # передаём backend'у информацию об исходном запросе
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}