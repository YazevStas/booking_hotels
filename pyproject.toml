[project]
name = "backend-course"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "bcrypt==4.0.1",
    "celery>=5.7.0",
    "fastapi>=0.162.2",
    "fastapi-cache2>=0.2.2",
    "jinja2>=3.1.6",
    "passlib>=1.7.4",
    "pydantic-settings>=2.16.2",
    "pydantic[email]>=2.14.3",
    "pyjwt>=2.15.1",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[tool.ruff]
target-version = "py314"
line-length = 120
# Миграции генерирует alembic, руками их не правим
extend-exclude = ["src/migrations/versions"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",  # pycodestyle: ошибки (без стилевых мелочей)
    "F",               # pyflakes
    "I",               # isort
    "B",               # flake8-bugbear
    "UP",              # pyupgrade
    "ASYNC",           # flake8-async
    "RUF",             # ruff-specific
]
# кириллица в строках/комментариях — не ошибка
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy резолвит строковые аннотации в relationship
"src/models/**" = ["UP037"]
# импорты после sys.path.append
"src/migrations/env.py" = ["E402"]
# в тестах блокирующее чтение фикстур не критично
"tests/**" = ["ASYNC230"]

[tool.ruff.lint.flake8-bugbear]
# Query(...), Body(...), Depends(...) в аргументах по умолчанию — штатный паттерн FastAPI
extend-immutable-calls = ["fastapi.Query", "fastapi.Body", "fastapi.Depends"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
exclude = ["src/migrations/versions", "**/__pycache__"]
typeCheckingMode = "standard"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-dotenv>=0.5.2",
    "ruff>=0.17.4",
]
