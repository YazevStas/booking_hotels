services:
  booking_db:
    image: postgres:17.6
    container_name: booking_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "6432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  booking_cashe:
    image: redis:8.10
    container_name: booking_cashe
    ports:
      - "7379:6379"

  # одноразовый контейнер: применяет миграции и завершается
  booking_migrations:
    build: .
    container_name: booking_migrations
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      booking_db:
        condition: service_healthy

  booking_back:
    build: .
    container_name: booking_back
    env_file: .env
    #ports:
    #  - "8000:8000"
    depends_on:
      booking_migrations:
        condition: service_completed_successfully
      booking_cashe:
        condition: service_started

  booking_nginx:
    image: nginx:1.30
    container_name: booking_nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      booking_back:
        condition: service_started

  booking_celery_worker:
    build: .
    container_name: booking_celery_worker
    env_file: .env
    command: ["celery", "--app=src.tasks.celery_app:celery_instance", "worker", "-l", "INFO"]
    depends_on:
      booking_migrations:
        condition: service_completed_successfully
      booking_cashe:
        condition: service_started

  booking_celery_beat:
    build: .
    container_name: booking_celery_beat
    env_file: .env
    command: ["celery", "--app=src.tasks.celery_app:celery_instance", "beat", "-l", "INFO"]
    depends_on:
      booking_cashe:
        condition: service_started

volumes:
  pg_data:
